<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img">
  <title>Matriz de costos de la decisión de fraude</title>
  <desc>Matriz de decisión de dos por dos: las filas son la decisión del modelo (aprobar o rechazar) y las columnas la clase real de la operación (legítima o fraudulenta). Cada celda muestra el resultado y su costo: correcto sin pérdida, fraude no detectado con pérdida del monto completo, falso positivo con pérdida de venta y cliente, y fraude bloqueado sin pérdida.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="78%">
      <stop offset="0%" stop-color="#131C3F"/>
      <stop offset="100%" stop-color="#070B18"/>
    </radialGradient>
    <radialGradient id="glowEm" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FB7185" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#FB7185" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t{font-family:Inter,'Segoe UI',system-ui,sans-serif}
      .tt{font-family:Inter,'Segoe UI',system-ui,sans-serif;font-weight:700;fill:#E6EDF7}
      .ts{font-family:Inter,'Segoe UI',system-ui,sans-serif;fill:#8A99C2}
      .l{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
    </style>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>

  <text class="tt" x="60" y="64" font-size="24">Matriz de costos de la decisión</text>
  <text class="ts" x="60" y="92" font-size="14">Cada error del modelo tiene un precio distinto.</text>

  <text class="ts" x="545" y="134" font-size="11" letter-spacing="3" text-anchor="middle">CLASE REAL</text>
  <text class="ts" x="320" y="162" font-size="16" font-weight="700" fill="#E6EDF7" text-anchor="middle">Operación legítima</text>
  <text class="ts" x="770" y="162" font-size="16" font-weight="700" fill="#E6EDF7" text-anchor="middle">Operación fraudulenta</text>

  <text class="ts" x="72" y="360" font-size="12" letter-spacing="3" text-anchor="middle" transform="rotate(-90 72 360)">DECISIÓN DEL MODELO</text>

  <!-- etiquetas de fila -->
  <rect x="92" y="253" width="74" height="34" rx="10" fill="#0E1530" stroke="#1E2A52" stroke-width="1.5"/>
  <text class="t" x="129" y="275" font-size="12" fill="#E6EDF7" text-anchor="middle">Aprobar</text>
  <rect x="92" y="433" width="74" height="34" rx="10" fill="#0E1530" stroke="#1E2A52" stroke-width="1.5"/>
  <text class="t" x="129" y="455" font-size="12" fill="#E6EDF7" text-anchor="middle">Rechazar</text>

  <!-- celda 1: correcto -->
  <rect x="170" y="190" width="270" height="160" rx="18" fill="#34D399" fill-opacity="0.10" stroke="#34D399" stroke-width="1.5"/>
  <circle cx="214" cy="240" r="17" fill="#34D399" fill-opacity="0.14" stroke="#34D399" stroke-width="1.6"/>
  <path class="l" d="M206 240 L212 247 L223 233" stroke="#34D399" stroke-width="2.2"/>
  <text class="tt" x="196" y="300" font-size="19">Correcto</text>
  <text class="ts" x="196" y="326" font-size="13">Transacción legítima aprobada</text>
  <text class="ts" x="184" y="212" font-size="11">1</text>
  <text class="t" x="456" y="262" font-size="13" fill="#34D399">pérdida: $0</text>
  <text class="ts" x="456" y="282" font-size="11">sin venta perdida</text>

  <!-- celda 2: fraude no detectado -->
  <ellipse cx="770" cy="270" rx="170" ry="110" fill="url(#glowRo)"/>
  <rect x="620" y="190" width="300" height="160" rx="18" fill="#FB7185" fill-opacity="0.12" stroke="#FB7185" stroke-width="1.8"/>
  <circle cx="664" cy="240" r="17" fill="#FB7185" fill-opacity="0.14" stroke="#FB7185" stroke-width="1.6"/>
  <circle cx="664" cy="240" r="8" fill="none" stroke="#FB7185" stroke-width="1.4" stroke-opacity="0.7"/>
  <path class="l" d="M652 228 L676 252" stroke="#FB7185" stroke-width="2"/>
  <text class="tt" x="646" y="300" font-size="19">Fraude no detectado</text>
  <text class="ts" x="646" y="326" font-size="13">La operación fraudulenta pasa el filtro</text>
  <text class="ts" x="634" y="212" font-size="11">2</text>
  <text class="t" x="934" y="262" font-size="13" fill="#FB7185">pérdida: $80.000</text>
  <text class="ts" x="934" y="282" font-size="11">monto + reposición del dinero</text>

  <!-- celda 3: falso positivo -->
  <rect x="170" y="370" width="270" height="160" rx="18" fill="#FBBF24" fill-opacity="0.10" stroke="#FBBF24" stroke-width="1.5"/>
  <circle cx="214" cy="420" r="17" fill="#FBBF24" fill-opacity="0.14" stroke="#FBBF24" stroke-width="1.6"/>
  <path class="l" d="M214 410 V430" stroke="#FBBF24" stroke-width="2.4"/>
  <text class="tt" x="196" y="480" font-size="19">Falso positivo</text>
  <text class="ts" x="196" y="506" font-size="13">Se bloquea una compra real</text>
  <text class="ts" x="184" y="392" font-size="11">3</text>
  <text class="t" x="456" y="442" font-size="13" fill="#FBBF24">pérdida: venta + cliente</text>
  <text class="ts" x="456" y="462" font-size="11">fricción y abandono</text>

  <!-- celda 4: fraude bloqueado -->
  <ellipse cx="770" cy="450" rx="170" ry="110" fill="url(#glowEm)"/>
  <rect x="620" y="370" width="300" height="160" rx="18" fill="#34D399" fill-opacity="0.16" stroke="#34D399" stroke-width="2.2"/>
  <path class="l" d="M664 400 L682 408 V424 C682 435 674 442 664 446 C654 442 646 435 646 424 V408 Z" fill="#34D399" fill-opacity="0.14" stroke="#34D399" stroke-width="1.8"/>
  <path class="l" d="M657 424 L662 430 L672 417" stroke="#34D399" stroke-width="2"/>
  <text class="tt" x="646" y="480" font-size="19">Fraude bloqueado</text>
  <text class="ts" x="646" y="506" font-size="13">El fraude nunca llega al comercio</text>
  <text class="ts" x="634" y="392" font-size="11">4</text>
  <text class="t" x="934" y="442" font-size="13" fill="#34D399">pérdida: $0</text>
  <text class="ts" x="934" y="462" font-size="11">fraude prevenido</text>

  <rect x="60" y="566" width="1080" height="62" rx="16" fill="#0E1530" stroke="#1E2A52" stroke-width="1.5"/>
  <text class="t" x="90" y="602" font-size="14" fill="#E6EDF7">Un falso positivo cuesta una venta; un fraude no detectado cuesta el monto completo.</text>
  <text class="ts" x="90" y="621" font-size="12">Por eso el sistema prefiere revisar y pedir autenticación antes de bloquear de forma ciega.</text>
</svg>
