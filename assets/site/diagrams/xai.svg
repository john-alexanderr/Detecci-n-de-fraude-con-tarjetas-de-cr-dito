<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img">
  <title>Explicación de una decisión: por qué se consideró riesgosa la transacción</title>
  <desc>Barras divergentes de contribución al riesgo: hacia la derecha, en rosa, las variables que aumentan el riesgo (importe superior al habitual, dispositivo nunca visto, muchas operaciones en poco tiempo y conexión con operaciones fraudulentas) y hacia la izquierda, en cian y esmeralda, las que lo reducen. Abajo, un medidor con el puntaje acumulado de 0,86 frente al umbral de decisión de 0,50.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="78%">
      <stop offset="0%" stop-color="#131C3F"/>
      <stop offset="100%" stop-color="#070B18"/>
    </radialGradient>
    <style>
      .t{font-family:Inter,'Segoe UI',system-ui,sans-serif}
      .tt{font-family:Inter,'Segoe UI',system-ui,sans-serif;font-weight:700;fill:#E6EDF7}
      .ts{font-family:Inter,'Segoe UI',system-ui,sans-serif;fill:#8A99C2}
      .l{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
      .card{fill:#0E1530;stroke:#1E2A52;stroke-width:1.5}
    </style>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>

  <text class="tt" x="60" y="64" font-size="24">¿Por qué se consideró riesgosa esta transacción?</text>
  <text class="ts" x="60" y="92" font-size="14">Contribución de cada variable al puntaje de riesgo (0 = neutro).</text>

  <text class="t" x="782" y="152" font-size="12" fill="#22D3EE" text-anchor="end">← reduce el riesgo</text>
  <text class="t" x="798" y="152" font-size="12" fill="#FB7185">aumenta el riesgo →</text>
  <path class="l" d="M790 160 V482" stroke="#1E2A52" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- variables que aumentan el riesgo -->
  <text class="t" x="380" y="188" font-size="13" fill="#E6EDF7" text-anchor="end">Importe superior al habitual</text>
  <rect x="790" y="170" width="345.4" height="26" rx="6" fill="#FB7185" fill-opacity="0.55" stroke="#FB7185" stroke-width="1.4"/>
  <text class="t" x="1125" y="188" font-size="12" fill="#E6EDF7" text-anchor="end">(+0,31)</text>

  <text class="t" x="380" y="240" font-size="13" fill="#E6EDF7" text-anchor="end">Dispositivo nunca visto</text>
  <rect x="790" y="222" width="267.4" height="26" rx="6" fill="#FB7185" fill-opacity="0.55" stroke="#FB7185" stroke-width="1.4"/>
  <text class="t" x="1047" y="240" font-size="12" fill="#E6EDF7" text-anchor="end">(+0,24)</text>

  <text class="t" x="380" y="292" font-size="13" fill="#E6EDF7" text-anchor="end">Muchas operaciones en poco tiempo</text>
  <rect x="790" y="274" width="211.7" height="26" rx="6" fill="#FB7185" fill-opacity="0.55" stroke="#FB7185" stroke-width="1.4"/>
  <text class="t" x="992" y="292" font-size="12" fill="#E6EDF7" text-anchor="end">(+0,19)</text>

  <text class="t" x="380" y="344" font-size="13" fill="#E6EDF7" text-anchor="end">Conexión con operaciones fraudulentas</text>
  <rect x="790" y="326" width="133.7" height="26" rx="6" fill="#FB7185" fill-opacity="0.55" stroke="#FB7185" stroke-width="1.4"/>
  <text class="t" x="914" y="344" font-size="12" fill="#E6EDF7" text-anchor="end">(+0,12)</text>

  <!-- variables que reducen el riesgo -->
  <text class="t" x="380" y="396" font-size="13" fill="#E6EDF7" text-anchor="end">Historial limpio del titular</text>
  <rect x="589.4" y="378" width="200.6" height="26" rx="6" fill="#22D3EE" fill-opacity="0.45" stroke="#22D3EE" stroke-width="1.4"/>
  <text class="t" x="599.4" y="396" font-size="12" fill="#E6EDF7">(−0,18)</text>

  <text class="t" x="380" y="448" font-size="13" fill="#E6EDF7" text-anchor="end">Comercio verificado</text>
  <rect x="667.4" y="430" width="122.6" height="26" rx="6" fill="#34D399" fill-opacity="0.45" stroke="#34D399" stroke-width="1.4"/>
  <text class="t" x="677.4" y="448" font-size="12" fill="#E6EDF7">(−0,11)</text>

  <text class="ts" x="60" y="486" font-size="12">Un valor positivo empuja la decisión hacia el rechazo; uno negativo la acerca a la aprobación.</text>

  <!-- medidor de puntaje -->
  <rect class="card" x="60" y="528" width="1080" height="106" rx="18"/>
  <text class="ts" x="90" y="556" font-size="11" letter-spacing="2">PUNTUJE DE RIESGO ACUMULADO</text>
  <rect x="90" y="566" width="1020" height="24" rx="8" fill="#0E1530" stroke="#1E2A52" stroke-width="1.5"/>
  <rect x="90" y="566" width="877" height="24" rx="8" fill="#FB7185" fill-opacity="0.45" stroke="#FB7185" stroke-width="1.4"/>
  <text class="ts" x="102" y="583" font-size="10">0</text>
  <text class="ts" x="1098" y="583" font-size="10" text-anchor="end">1,0</text>
  <path class="l" d="M600 560 V598" stroke="#FB7185" stroke-width="1.8" stroke-dasharray="5 5"/>
  <path class="l" d="M967 560 V598" stroke="#FB7185" stroke-width="2.4"/>
  <circle cx="967" cy="578" r="6" fill="#FB7185"/>
  <text class="t" x="600" y="618" font-size="12" fill="#FB7185" text-anchor="middle">umbral de decisión · 0,50</text>
  <text class="t" x="967" y="618" font-size="12" fill="#E6EDF7" text-anchor="middle">0,86 · bloqueado</text>
</svg>
