<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img">
  <title>Grafo de fraude: cinco tarjetas, un dispositivo compartido y una dirección común</title>
  <desc>Red de grafos con 21 nodos de cinco tipos: tarjeta, dispositivo, comercio, cliente y dirección. Un anillo resaltado en rosa muestra cinco tarjetas fraudulentas que comparten un mismo dispositivo y una misma dirección, mientras el resto de la red aparece en tonos apagados. Abajo, la leyenda de tipos de nodo.</desc>
