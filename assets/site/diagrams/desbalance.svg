<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img">
  <title>Aguja en el haystack: el fraude es una fracción mínima del tráfico</title>
  <desc>Matriz de aproximadamente mil puntos de datos donde la mayoría son cian (operaciones legítimas) y solo unos pocos, al final de la matriz, son rosa (operaciones fraudulentas). Una lupa ampliada marca la zona del fraude y una anotación indica que el 0,1727 % de las transacciones son marcadas como fraudulentas.</desc>
