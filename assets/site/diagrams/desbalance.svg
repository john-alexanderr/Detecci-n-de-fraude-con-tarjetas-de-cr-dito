    <radialGradient id="bg" cx="50%" cy="40%" r="78%">
      <stop offset="0%" stop-color="#131C3F"/>
      <stop offset="100%" stop-color="#070B18"/>
    </radialGradient>
    <radialGradient id="lens" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0E1530" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#070B18" stop-opacity="0.78"/>
    </radialGradient>
    <radialGradient id="roseglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FB7185" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FB7185" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#16204A" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
    <style>
      .t{font-family:Inter,'Segoe UI',system-ui,sans-serif}
      .tt{font-family:Inter,'Segoe UI',system-ui,sans-serif;font-weight:700;fill:#E6EDF7}
      .ts{font-family:Inter,'Segoe UI',system-ui,sans-serif;fill:#8A99C2}
