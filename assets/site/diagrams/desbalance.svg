      .card{fill:#0E1530;stroke:#1E2A52;stroke-width:1.5}
    </style>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <text class="tt" x="60" y="60" font-size="24">Aguja en el haystack</text>
  <text class="ts" x="60" y="88" font-size="14">El fraude es una fracción mínima del tráfico total de tarjetas.</text>

